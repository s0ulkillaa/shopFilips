<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contattaci - Shop Filips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <iframe src="header.html" class="site-headerss" title="Intestazione e navigazione"></iframe>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2>Contattaci</h2>

                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" maxlength="200">
                        </div>
                        <div class="col-md-6">
                            <label for="cognome" class="form-label">Cognome</label>
                            <input type="text" class="form-control" id="cognome" name="cognome" maxlength="200">
                        </div>
                        <div class="col-12">
                            <label for="messaggio" class="form-label">Cosa stai cercando / informazioni</label>
                            <textarea class="form-control" id="messaggio" name="messaggio" rows="4"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Invia</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <iframe src="footer.html" class="site-footer" title="Piè di pagina"></iframe>
</body>
</html>
