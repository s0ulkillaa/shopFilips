<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contattaci - Shop Filips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <iframe src="header.html" class="site-header" title="Intestazione e navigazione"></iframe>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2>Contattaci</h2>

                <form id="contatto-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" maxlength="200">
                        </div>
                        <div class="col-md-6">
                            <label for="cognome" class="form-label">Cognome</label>
                            <input type="text" class="form-control" id="cognome" name="cognome" maxlength="200">
                        </div>
                        <div class="col-md-6">
                            <label for="exampleInputEmail1" class="form-label">Email</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" name="email">
                        </div>
                          <div class="col-12">
                            <label for="messaggio" class="form-label">Cosa stai cercando / informazioni</label>
                            <textarea class="form-control" id="messaggio" name="messaggio" rows="4"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Invia</button>
                        </div>
                        <div class="col-12" id="stato-invio" role="status" aria-live="polite"></div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <iframe src="footer.html" class="site-footer" title="Piè di pagina"></iframe>
    <script>
        const form = document.getElementById('contatto-form');
        const statoInvio = document.getElementById('stato-invio');
        form.addEventListener('submit', function(event){
            console.log(form);
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const cognome = document.getElementById('cognome').value;
            const email = document.getElementById('exampleInputEmail1').value;
            const messaggio = document.getElementById('messaggio').value;
            const datiUtente = {
                email: email,
                messaggio: messaggio,
                dataSave: new Date().toLocaleString()
            };
            localStorage.setItem('utenteLocale', JSON.stringify(datiUtente));
            localStorage.setItem('nome', nome);
            localStorage.setItem('cognome', cognome);

            statoInvio.textContent = "Dati salvati con successo";
            form.reset();
        });
    </script>
</body>
</html>
