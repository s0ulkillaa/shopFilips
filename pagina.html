    <!-- JAVASCRIPT: CAMBIO IMMAGINI -->
    <script>
    // Array contenente le immagini disponibili
    const immagini = [
        "img/immagine_prodotto_1.webp",
        "img/foto2.webp",
        "img/foto3.jpeg",
        "img/foto4.jpeg",
        "img/foto5.jpeg",
        "img/foto6.webp",
        "img/foto7.jpeg",
        "img/foto8.jpeg"
    ];

    // Seleziona tutte e 5 le immagini dei prodotti
    const prodotti = document.querySelectorAll(".immagine-casuale");

    // Array che memorizza l'indice dell'immagine attuale per ciascun prodotto
    const ultimeImmagini = [];

    // Funzione che cambia l'immagine di UN SOLO prodotto evitando di ripetere la sua precedente
    function cambiaImmagineProdotto(indiceProdotto) {
        const img = prodotti[indiceProdotto];
        const precedente = ultimeImmagini[indiceProdotto];

        let nuovoNumero = Math.floor(Math.random() * immagini.length);

        // Continua a sorteggiare finché esce un'immagine diversa da quella che ha già
        while (nuovoNumero === precedente) {
            nuovoNumero = Math.floor(Math.random() * immagini.length);
        }

        // Aggiorna l'immagine nella pagina e salva il nuovo numero in memoria
        img.src = immagini[nuovoNumero];
        ultimeImmagini[indiceProdotto] = nuovoNumero;
    }

    // 1. AVVIO: Imposta subito un'immagine casuale per tutti e 5 i prodotti
    prodotti.forEach(function(img, index) {
        cambiaImmagineProdotto(index);
    });

    // 2. SEQUENZA: Ogni 5 secondi cambia un prodotto alla volta in fila
    let prodottoAttuale = 0;

    setInterval(function() {
        // Cambia solo il prodotto di turno
        cambiaImmagineProdotto(prodottoAttuale);

        // Passa al prodotto successivo
        prodottoAttuale++;

        // Se ha superato l'ultimo prodotto (indice 4), ricomincia dal primo (indice 0)
        if (prodottoAttuale >= prodotti.length) {
            prodottoAttuale = 0;
        }
    }, 1000);
</script>
