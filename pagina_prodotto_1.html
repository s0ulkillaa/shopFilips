<!DOCTYPE html>
<html lang="it">
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <style>
    .product-page {
      display: flex;
      gap: 30px;
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Colonna sinistra: Immagine e dettagli principali */
    .product-left {
      flex: 2;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .product-image {
      max-width: 300px;
      height: auto;
    }

    .product-info h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .product-info p {
      color: #333;
      line-height: 1.5;
    }

    /* Colonna destra: Box Acquisto (Prezzo, Carrello e Checkout) */
    .buy-box {
      flex: 1;
      max-width: 300px;
      border: 1px solid #d5d9d9;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: fit-content;
    }

    .buy-box .price {
      font-size: 28px;
      font-weight: bold;
      color: #0F1111;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add-to-cart {
      background-color: #ffd814;
      color: #0F1111;
    }

    .btn-add-to-cart:hover {
      background-color: #f7ca00;
    }

    .btn-buy-now {
      background-color: #ffa41c;
      color: #0F1111;
    }

    .btn-buy-now:hover {
      background-color: #fa8900;
    }
  </style>
</head>
<body>
    <h1>Shop Filips</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="pagina.html">Prodotti</a></li>
      <li><a href="#contact">Contatti</a></li>
    </ul>
    <div>
  <div class="product-page">
    
    <div class="product-left">
      <img src="img/immagine_prodotto_1.webp" alt="Case PC Gaming" class="product-image">
      <div class="product-info">
        <h3>Nome Prodotto</h3 width="300px">
        <p>Primis dictum, mollis volutpat ultrices semper. Sollicitudin dapibus pulvinar, nulla auctor commodo mi. Aptent massa, odio quam laoreet. Ullamcorper tincidunt purus.</p>
      </div>
    </div>

    <div class="buy-box">
      <div class="price">1000€</div>
      <button class="btn btn-add-to-cart">Aggiungi al carrello</button>
      <button class="btn btn-buy-now">Acquista ora</button>
    </div>

  </div>

</body>
</html>
