<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
    <script src="auth.js"></script>
    <script>richiediLogin();</script>
  <title>Shop Filips</title>
  
  <link rel="icon" type="image/png" href="./img/filips.png">
  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-page {
      display: flex;
      gap: 30px;
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .product-left {
      flex: 2;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .product-image {
      max-width: 300px;
      height: auto;
    }

    .product-info h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .product-info p {
      color: #333;
      line-height: 1.5;
      flex: 1;
      max-width: 600px;
      border: 1px solid #d5d9d9;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: fit-content;
    }

    .buy-box {
      flex: 1;
      max-width: 300px;
      border: 1px solid #d5d9d9;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: fit-content;
    }

    .buy-box .price {
      font-size: 28px;
      font-weight: bold;
      color: #0F1111;
    }

    .buy-box .payment-image {
      max-width: 100%;
      height: auto;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add-to-cart {
      background-color: #ffd814;
      color: #0F1111;
    }

    .btn-add-to-cart:hover {
      background-color: #f7ca00;
    }

    .btn-buy-now {
      background-color: #ffa41c;
      color: #0F1111;
    }

    .btn-buy-now:hover {
      background-color: #fa8900;
    }
  </style>
</head>
<body>

  <iframe src="header.html" class="site-header" title="Intestazione e navigazione"></iframe>
  <iframe src="nav_bar.html" class="site-nav" title="Navigazione"></iframe>

  <div class="product-page">
    
    <div class="product-left">
      <img src="img/immagine_prodotto_1.webp" alt="Case PC Gaming" class="product-image">
      <div class="product-info">
        <h3>Nome Prodotto</h3>
        <p>Primis dictum, mollis volutpat ultrices semper. Sollicitudin dapibus pulvinar, nulla auctor commodo mi. Aptent massa, odio quam laoreet. Ullamcorper tincidunt purus.</p>
      </div>
    </div>

    <div class="buy-box">   
      <div class="price">2999.99€</div>
      <img src="img/immagine_metodi_pagamento.png" alt="Metodi di pagamento" class="payment-image">
      <button class="btn btn-add-to-cart">Aggiungi al carrello</button>
      <button class="btn btn-buy-now">Acquista ora</button>
    </div>

  </div>
    <iframe src="footer.html" class="site-footer" title="Piè di pagina"></iframe>

</body>
</html>
