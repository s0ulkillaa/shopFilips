<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrazione - Shop Filips</title>
    <link rel="icon" type="image/png" href="./img/filips.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <iframe src="header.html" class="site-header" title="Intestazione"></iframe>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2>Registrati</h2>
                <form id="registrazione-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" autocomplete="given-name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="cognome" class="form-label">Cognome</label>
                            <input type="text" class="form-control" id="cognome" name="cognome" autocomplete="family-name" required>
                        </div>
                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Password (almeno 8 caratteri)</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="conferma" class="form-label">Conferma password</label>
                            <input type="password" class="form-control" id="conferma" name="conferma" minlength="8" autocomplete="new-password" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Registrati</button>
                            <a href="pagina_login.html" class="btn btn-link">Hai già un account? Accedi</a>
                        </div>
                    </div>
                    <div id="messaggio" class="mt-3 text-center" role="status"></div>
                </form>
            </div>
        </div>
    </main>

    <iframe src="footer.html" class="site-footer" title="Piè di pagina"></iframe>

    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('registrazione-form');
        const messaggio = document.getElementById('messaggio');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const cognome = document.getElementById('cognome').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const conferma = document.getElementById('conferma').value;

            if (password.length < 8) {
                mostraMessaggio(messaggio, 'La password deve avere almeno 8 caratteri.', 'errore');
                return;
            }
            if (password !== conferma) {
                mostraMessaggio(messaggio, 'Le due password non coincidono.', 'errore');
                return;
            }

            try {
                const utenti = leggiUtenti();
                if (utenti.some(u => u.email === email)) {
                    mostraMessaggio(messaggio, 'Esiste già un account con questa email.', 'errore');
                    return;
                }

                const salt = generaSalt();
                const hash = await calcolaHash(password, salt);
                utenti.push({
                    nome: nome,
                    cognome: cognome,
                    email: email,
                    salt: salt,
                    hash: hash,
                    dataRegistrazione: new Date().toISOString()
                });
                salvaUtenti(utenti);

                form.reset();
                mostraMessaggio(messaggio, 'Registrazione completata. Ti porto al login...', 'ok');
                setTimeout(function () { window.location.href = PAGINA_LOGIN; }, 1500);
            } catch (e) {
                mostraMessaggio(messaggio, 'Impossibile completare la registrazione.', 'errore');
            }
        });
    </script>
</body>
</html>
