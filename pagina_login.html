<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Shop Filips</title>
    <link rel="icon" type="image/png" href="./img/filips.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <iframe src="header.html" class="site-header" title="Intestazione"></iframe>
    <iframe src="nav_bar.html" class="site-nav" title="Navigazione"></iframe>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">Login</h2>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email"
                               placeholder="Inserisci la tua email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password"
                               placeholder="Inserisci la tua password" autocomplete="current-password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Accedi</button>
                        <a href="pagina_registrazione.html" class="btn btn-outline-primary">Registrati</a>
                    </div>
                    <div id="messaggio" class="mt-3 text-center" role="status"></div>
                </form>
            </div>
        </div>
    </div>

    <iframe src="footer.html" class="site-footer" title="Piè di pagina"></iframe>

    <script>
        // Gestisce il submit del login e salva l'email nel localStorage
        const form = document.getElementById('login-form');
        const messaggio = document.getElementById('messaggio');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();

            try {
                localStorage.setItem('utenteLocale', JSON.stringify({
                    email: email,
                    dataSave: new Date().toLocaleString()
                }));
                messaggio.textContent = 'Dati salvati con successo';
                messaggio.className = 'mt-3 text-center text-success';
                form.reset();
            } catch (e) {
                messaggio.textContent = 'Impossibile salvare i dati';
                messaggio.className = 'mt-3 text-center text-danger';
            }
        });
    </script>
</body>
</html>
